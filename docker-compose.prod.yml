services:
  # Python Backend Service
  backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: tools-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
      - MAX_TOTAL_SIZE=${MAX_TOTAL_SIZE:-104857600}
      # Polar.sh (Primary)
      - POLAR_ORGANIZATION_ID=${POLAR_ORGANIZATION_ID}
      # LemonSqueezy (Legacy)
      - LEMONSQUEEZY_API_KEY=${LEMONSQUEEZY_API_KEY}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    tmpfs:
      - /tmp/offline_tools_api
    networks:
      - app-network

  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./website
      dockerfile: Dockerfile
      args:
        # Polar.sh (Primary)
        - NEXT_PUBLIC_POLAR_CHECKOUT_URL=${NEXT_PUBLIC_POLAR_CHECKOUT_URL}
        - NEXT_PUBLIC_POLAR_PRODUCT_ID=${NEXT_PUBLIC_POLAR_PRODUCT_ID}
        # LemonSqueezy (Legacy fallback)
        - NEXT_PUBLIC_LEMONSQUEEZY_CHECKOUT_URL=${NEXT_PUBLIC_LEMONSQUEEZY_CHECKOUT_URL}
        - NEXT_PUBLIC_LEMONSQUEEZY_VARIANT_ID=${NEXT_PUBLIC_LEMONSQUEEZY_VARIANT_ID:-1167418}
    container_name: tools-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      # Polar.sh (Primary)
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET}
      - POLAR_ORGANIZATION_ID=${POLAR_ORGANIZATION_ID}
      # LemonSqueezy (Legacy fallback)
      - NEXT_PUBLIC_LEMONSQUEEZY_CHECKOUT_URL=${NEXT_PUBLIC_LEMONSQUEEZY_CHECKOUT_URL}
      - NEXT_PUBLIC_LEMONSQUEEZY_VARIANT_ID=${NEXT_PUBLIC_LEMONSQUEEZY_VARIANT_ID:-1167418}
      - LEMONSQUEEZY_WEBHOOK_SECRET=${LEMONSQUEEZY_WEBHOOK_SECRET}
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Download URLs (Cloudflare R2)
      - DOWNLOAD_URL_WINDOWS=${DOWNLOAD_URL_WINDOWS}
      - DOWNLOAD_URL_MAC=${DOWNLOAD_URL_MAC}
      - DOWNLOAD_URL_LINUX=${DOWNLOAD_URL_LINUX}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
