name: Build Desktop App

on:
  push:
    branches:
      - main
    tags:
      - "v*" # Build on version tags
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: python-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Python backend (Windows)
        working-directory: python-backend
        shell: bash
        run: |
          pyinstaller python-backend.spec --clean --noconfirm
          mkdir -p ../src-tauri/binaries
          cp dist/python-backend.exe ../src-tauri/binaries/python-backend-x86_64-pc-windows-msvc.exe

      - name: Bundle Tesseract (Windows)
        run: npm run bundle:tesseract:win

      - name: Rename Tesseract binary (Windows)
        run: |
          cd src-tauri/binaries/tesseract
          cp tesseract.exe tesseract-x86_64-pc-windows-msvc.exe

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 400

  build-linux:
    name: Build Linux Installer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            tesseract-ocr \
            tesseract-ocr-eng

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: python-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Python backend (Linux)
        working-directory: python-backend
        run: |
          pyinstaller python-backend.spec --clean --noconfirm
          mkdir -p ../src-tauri/binaries
          cp dist/python-backend ../src-tauri/binaries/python-backend-x86_64-unknown-linux-gnu
          chmod +x ../src-tauri/binaries/python-backend-x86_64-unknown-linux-gnu

      - name: Bundle Tesseract (Linux)
        run: npm run bundle:tesseract:unix

      - name: Rename Tesseract binary (Linux)
        run: |
          cd src-tauri/binaries/tesseract
          cp tesseract tesseract-x86_64-unknown-linux-gnu
          chmod +x tesseract-x86_64-unknown-linux-gnu

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
          retention-days: 400

  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: python-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Python backend (macOS)
        working-directory: python-backend
        run: |
          pyinstaller python-backend.spec --clean --noconfirm
          mkdir -p ../src-tauri/binaries
          # Detect architecture
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            cp dist/python-backend ../src-tauri/binaries/python-backend-aarch64-apple-darwin
            chmod +x ../src-tauri/binaries/python-backend-aarch64-apple-darwin
          else
            cp dist/python-backend ../src-tauri/binaries/python-backend-x86_64-apple-darwin
            chmod +x ../src-tauri/binaries/python-backend-x86_64-apple-darwin
          fi

      - name: Install Homebrew dependencies
        run: |
          brew install tesseract

      - name: Bundle Tesseract (macOS)
        run: npm run bundle:tesseract:unix

      - name: Rename Tesseract binary (macOS)
        run: |
          cd src-tauri/binaries/tesseract
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            cp tesseract tesseract-aarch64-apple-darwin
            chmod +x tesseract-aarch64-apple-darwin
          else
            cp tesseract tesseract-x86_64-apple-darwin
            chmod +x tesseract-x86_64-apple-darwin
          fi

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
          retention-days: 400

  # Create GitHub Release with permanent storage (on tags only)
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: artifacts/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: artifacts/macos

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Local Tools ${{ github.ref_name }}
          body: |
            ## 🎉 Desktop App Release ${{ github.ref_name }}

            Download installers for your platform:

            - **Windows**: `.msi` and `.exe` installers
            - **Linux**: `.deb`, `.AppImage`, and `.rpm` packages
            - **macOS**: `.dmg` disk image

            ### Installation Instructions
            1. Download the installer for your platform
            2. Run the installer
            3. Follow the setup wizard

            ### Offline Access
            These installers provide full offline functionality with bundled Tesseract OCR and Python backend.
          files: |
            artifacts/windows/**/*
            artifacts/linux/**/*
            artifacts/macos/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Upload to Cloudflare R2 for public downloads
  upload-to-r2:
    name: Upload to Cloudflare R2
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    # Only upload on main branch pushes or version tags
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: artifacts/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: artifacts/macos

      - name: Prepare files for upload
        run: |
          mkdir -p upload/latest

          # Get version from tag or use 'latest'
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            mkdir -p "upload/${VERSION}"
          else
            VERSION="latest"
          fi

          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          # Find and copy Windows installer (.exe from NSIS, prefer over .msi)
          WINDOWS_EXE=$(find artifacts/windows -name "*.exe" -type f | head -1)
          if [ -n "$WINDOWS_EXE" ]; then
            cp "$WINDOWS_EXE" "upload/latest/Local-Tools-Setup.exe"
            if [ "$VERSION" != "latest" ]; then
              cp "$WINDOWS_EXE" "upload/${VERSION}/Local-Tools-Setup-${VERSION}.exe"
            fi
            echo "✅ Windows: $WINDOWS_EXE"
          fi

          # Find and copy macOS installer (.dmg)
          MACOS_DMG=$(find artifacts/macos -name "*.dmg" -type f | head -1)
          if [ -n "$MACOS_DMG" ]; then
            cp "$MACOS_DMG" "upload/latest/Local-Tools.dmg"
            if [ "$VERSION" != "latest" ]; then
              cp "$MACOS_DMG" "upload/${VERSION}/Local-Tools-${VERSION}.dmg"
            fi
            echo "✅ macOS: $MACOS_DMG"
          fi

          # Find and copy Linux installer (.AppImage preferred)
          LINUX_APPIMAGE=$(find artifacts/linux -name "*.AppImage" -type f | head -1)
          if [ -n "$LINUX_APPIMAGE" ]; then
            cp "$LINUX_APPIMAGE" "upload/latest/Local-Tools.AppImage"
            if [ "$VERSION" != "latest" ]; then
              cp "$LINUX_APPIMAGE" "upload/${VERSION}/Local-Tools-${VERSION}.AppImage"
            fi
            echo "✅ Linux: $LINUX_APPIMAGE"
          fi

          # List files to upload
          echo ""
          echo "📦 Files prepared for upload:"
          find upload -type f -exec ls -lh {} \;

      - name: Install rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = private
          EOF

      - name: Upload to R2
        run: |
          # Upload latest folder
          rclone copy upload/latest r2:${{ secrets.R2_BUCKET_NAME }}/latest --progress

          # Upload versioned folder if this is a tag
          if [ "${{ env.VERSION }}" != "latest" ]; then
            rclone copy "upload/${{ env.VERSION }}" "r2:${{ secrets.R2_BUCKET_NAME }}/${{ env.VERSION }}" --progress
          fi

          echo "✅ Upload complete!"

      - name: Verify upload
        run: |
          echo "📂 Files in R2 bucket (latest/):"
          rclone ls r2:${{ secrets.R2_BUCKET_NAME }}/latest || echo "Could not list files"

      - name: Upload Summary
        run: |
          echo "## ☁️ Cloudflare R2 Upload Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Uploaded Files:" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | File | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | Local-Tools-Setup.exe | \`/latest/Local-Tools-Setup.exe\` |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | Local-Tools.dmg | \`/latest/Local-Tools.dmg\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | Local-Tools.AppImage | \`/latest/Local-Tools.AppImage\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.VERSION }}" != "latest" ]; then
            echo "### Versioned Files (${{ env.VERSION }}):" >> $GITHUB_STEP_SUMMARY
            echo "Also uploaded to \`/${{ env.VERSION }}/\` folder" >> $GITHUB_STEP_SUMMARY
          fi

  # Build summary job
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos, upload-to-r2]
    if: always()

    steps:
      - name: Build Summary
        run: |
          echo "## 🎉 Desktop App Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status:" >> $GITHUB_STEP_SUMMARY
          echo "- Windows: ${{ needs.build-windows.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Linux: ${{ needs.build-linux.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- macOS: ${{ needs.build-macos.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- R2 Upload: ${{ needs.upload-to-r2.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "📦 Artifacts are available for download (retained for 400 days)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "🏷️  GitHub Release created with permanent storage" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.upload-to-r2.result }}" = "success" ]; then
            echo "☁️  Files uploaded to Cloudflare R2 for public download" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Tip**: For permanent storage, create a version tag (e.g., \`v1.0.0\`) to automatically create a GitHub Release." >> $GITHUB_STEP_SUMMARY
