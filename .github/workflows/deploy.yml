name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.HETZNER_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Hetzner
        run: |
          ssh root@${{ secrets.HETZNER_SERVER_IP }} << 'EOF'
            set -e
            echo "🚀 Starting deployment..."

            # Navigate to project directory
            cd ~/local-tools || { echo "❌ Project directory not found!"; exit 1; }

            # Pull latest changes
            echo "📥 Pulling latest changes..."
            git pull origin main || { echo "❌ Git pull failed!"; exit 1; }

            # Stop containers
            echo "🛑 Stopping containers..."
            docker compose -f docker-compose.prod.yml down || true

            # Clean up Docker to free disk space
            echo "🧹 Cleaning up Docker resources..."
            docker system prune -af --volumes || true
            docker builder prune -af || true
            
            # Check disk space
            echo "💾 Disk space before build:"
            df -h

            # Rebuild containers
            echo "🔨 Rebuilding containers..."
            docker compose -f docker-compose.prod.yml build --no-cache backend frontend || { echo "❌ Build failed!"; exit 1; }
            
            # Clean up build cache after build
            echo "🧹 Cleaning up build cache..."
            docker builder prune -af || true

            # Start containers
            echo "▶️ Starting containers..."
            docker compose -f docker-compose.prod.yml up -d || { echo "❌ Start failed!"; exit 1; }

            # Wait for services to be ready
            echo "⏳ Waiting for services to start..."
            sleep 10

            # Health check
            echo "🏥 Running health checks..."
            if curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Backend health check passed"
            else
              echo "⚠️ Backend health check failed (may still be starting)"
            fi

            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Frontend health check passed"
            else
              echo "⚠️ Frontend health check failed (may still be starting)"
            fi

            # Show container status
            echo "📊 Container status:"
            docker compose -f docker-compose.prod.yml ps

            echo "✅ Deployment completed!"
          EOF

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Code pulled from main branch" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker containers rebuilt" >> $GITHUB_STEP_SUMMARY
          echo "✅ Services restarted" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Verify services are running: \`docker compose ps\`" >> $GITHUB_STEP_SUMMARY
          echo "- Check logs: \`docker compose logs -f\`" >> $GITHUB_STEP_SUMMARY
          echo "- Test your site: https://localtools.pro" >> $GITHUB_STEP_SUMMARY
